version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: reconcilex-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: reconcilex_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: reconcilex-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: "jdbc:mysql://mysql:3306/reconcilex_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      DB_USER: "root"
      DB_PASSWORD: "password"
      PORT: "8080"

volumes:
  mysql_data:
